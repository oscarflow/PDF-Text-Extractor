<!DOCTYPE html>
<html xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" lang="en-US" xml:lang="en-US">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

  <!-- Target IE10 phones -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>{{build.title}}</title>
  <style type="text/css">
    /***************************************
                GLOBAL STYLES
    ****************************************/

    .main-td {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #263340;
      line-height: 20px;
      background-color: #ffffff;
      min-width: {{build.breakpoints.large.value}}{{build.breakpoints.large.unit}};/*android fix*/
    }

    .h1 { font-size: 22px; line-height: 26px; color: #003479; font-weight: bold; }
    .h2 { font-size: 20px; line-height: 24px; color: #003479; font-weight: bold; }
    .h3 { font-size: 18px; line-height: 22px; color: #003479; font-weight: bold; }
    .h4 { font-size: 16px; line-height: 20px; color: #003479; font-weight: bold; }
    .h5 { font-size: 14px; line-height: 18px; color: #003479; font-weight: bold; }
    .h6 { font-size: 12px; line-height: 16px; color: #003479; font-weight: bold; }

    a { text-decoration: underline; }
    .left-content a { color: #1c75bc; }

    /* Build Section Styling */
    
    .preheader {
      padding-right: 20px;
      padding-left: 20px;
      padding-top: 20px;
      padding-bottom: 20px;
      background-color: #e6bfd4;
    }
    .webversion a { color: #333333; }
    .header {
      padding-right: 20px;
      padding-left: 20px;
      padding-top: 20px;
      padding-bottom: 20px;
      background-color: #ffc5d3;
    }
    .left-content {
      padding-right: 20px;
      padding-left: 20px;
      padding-top: 20px;
      padding-bottom: 20px;
      background-color: #ffdfd8;
    }
    .rr-safety {
      padding-right: 10px;
      padding-left: 10px;
      padding-top: 20px;
      padding-bottom: 20px;
      background-color: #f1ffe8;
    }
    .safety-cont {
      padding-right: 10px;
      padding-left: 10px;
      padding-top: 20px;
      padding-bottom: 20px;
      background-color: #edf4ff;
    }
    .footer {
      padding-right: 20px;
      padding-left: 20px;
      padding-top: 20px;
      padding-bottom: 20px;
      background-color: #bfc7cf;
    }
    /* Legal Links */
    .link-divider { font-weight: lighter; padding-left: 6px; padding-right: 6px; }
    .legal a { text-decoration: none; }
    .legal a span { text-decoration: underline; }

    .references tr:first-child .li + td { width: auto; }
    .references .li { width: 15px; }
    /*fixes width issue in yahoo*/

    .footnote,
    .footnote td { font-size: 10px; line-height: 13px; }

    /* Horizontal Rule */
    .bt-color { border-top: 2px solid #001c71; }

    /* additional colors */
    .black { color: #000001; }  
    .white { color: #ffffff; }

    /* Element Styling */
    .p,
    .ul { padding-bottom: 15px; }

    .li { width: 1px; }
    .ul .li { padding-right: 5px; }

    .ul .ul { padding-top: 0; padding-right: 0; padding-bottom: 0; padding-left: 10px; }
    .ul tr:first-child .li + td { width: 100%; }      

    sup, sub { line-height: 0; font-size: 75%; }

    /* Additional formatting and styling */
    .center { text-align: center; }
    .center-block { margin: 0 auto; }
    .no-underline { text-decoration: none; }
    .underline { text-decoration: underline; }
    .bold { font-weight: bold; }

    .no-wrap { white-space: nowrap; }
    a[href^="tel:"] { white-space: nowrap; }
    
    .mobile-only { display: none; max-height: 0px; overflow: hidden; }
    /*Hides mobile only elements. Needs to be inlined for Gmail*/

    /* Callout styling */
    .callout {
      font-size: 15px;
      line-height: 19px;
      color: #ffffff;
      background-color: #79cd3f;
      padding-top: 10px;
      padding-bottom: 10px;
      padding-right: 10px;
      padding-left: 10px;
    }
        
    /* Button Styling */
    .button { 
      font-size: 15px;
      line-height: 19px;
      font-weight: bold;
      text-align: center;
      color: #ffffff;
      background-color: #00b2e2;
      border: 1px solid #00b2e2;
      /*border-radius: 5px; */
    }

    .button a { 
      color: #ffffff;  
      text-decoration: none; 
      display: block; 
      padding-top: 10px;
      padding-bottom: 10px;
      border: 1px solid #00b2e2; /*border hack needed for outlook clients*/
      /*border-radius: 5px;*/ 
    }

    /* Non-standard button code to be used with the tnon snippet */
    /* .ns-button{
      font-size: 15px;
      line-height: 19px;
      font-weight: bold;

      color: #ffffff;
      background-color: #00b2e2;
      border: 2px solid #00b2e2;       
    }
    .ns-button a {
      color: #ffffff;  
      text-decoration: none; 
      display: block; 
      padding-top: 10px;
      padding-bottom: 10px;
      border: 0px solid #00b2e2;

    /***************************************
                 SPACING STYLES 
    ****************************************/

    .ptb0  { padding-top: 0; padding-bottom: 0; }
    .ptb5  { padding-top: 5px; padding-bottom: 5px; }
    .ptb10 { padding-top: 10px; padding-bottom: 10px; }
    .ptb15 { padding-top: 15px; padding-bottom: 15px; }
    .ptb20 { padding-top: 20px; padding-bottom: 20px; }
    .ptb25 { padding-top: 25px; padding-bottom: 25px; }
    .ptb30 { padding-top: 30px; padding-bottom: 30px; }
    .ptb35 { padding-top: 35px; padding-bottom: 35px; }
    .ptb40 { padding-top: 40px; padding-bottom: 40px; }
    /* Padding top and bottom */

    .pt0  { padding-top: 0; }
    .pt5  { padding-top: 5px; }
    .pt10 { padding-top: 10px; } 
    .pt15 { padding-top: 15px; } 
    .pt20 { padding-top: 20px; } 
    .pt25 { padding-top: 25px; }
    .pt30 { padding-top: 30px; }
    .pt35 { padding-top: 35px; }
    .pt40 { padding-top: 40px; }
    /* padding top */

    .pb0  { padding-bottom: 0; } 
    .pb5  { padding-bottom: 5px; }
    .pb10 { padding-bottom: 10px; }
    .pb15 { padding-bottom: 15px; }
    .pb20 { padding-bottom: 20px; }
    .pb25 { padding-bottom: 25px; }
    .pb30 { padding-bottom: 30px; }
    .pb35 { padding-bottom: 35px; }
    .pb40 { padding-bottom: 40px; }
    /* padding bottom */

    .prl0  { padding-right: 0; padding-left: 0; }
    .prl5  { padding-right: 5px; padding-left: 5px; }
    .prl10 { padding-right: 10px; padding-left: 10px; }
    .prl15 { padding-right: 15px; padding-left: 15px; }
    .prl20 { padding-right: 20px; padding-left: 20px; }
    .prl25 { padding-right: 25px; padding-left: 25px; }
    .prl30 { padding-right: 30px; padding-left: 30px; }
    .prl35 { padding-right: 35px; padding-left: 35px; }
    .prl40 { padding-right: 40px; padding-left: 40px; }
    /* Padding left and right */

    .pr0  { padding-right: 0; } 
    .pr5  { padding-right: 5px; }  
    .pr10 { padding-right: 10px; }
    .pr15 { padding-right: 15px; }
    .pr20 { padding-right: 20px; }
    .pr25 { padding-right: 25px; }
    .pr30 { padding-right: 30px; }
    .pr35 { padding-right: 35px; }
    .pr40 { padding-right: 40px; }
    /* padding right */

    .pl0  { padding-left: 0; }
    .pl5  { padding-left: 5px; }
    .pl10 { padding-left: 10px; }
    .pl15 { padding-left: 15px; }
    .pl20 { padding-left: 20px; }
    .pl25 { padding-left: 25px; }
    .pl30 { padding-left: 30px; }
    .pl35 { padding-left: 35px; }
    .pl40 { padding-left: 40px; }
    /* padding left */

    /***************************************
            CLIENT SPECIFIC STYLES
    ****************************************/

    /* Use on td's if you need to match line-height. NOTE: Use only on td's with text */
    .mso-exact { mso-line-height-rule: exactly; }

    #outlook a { padding: 0; } 
    /* Force Outlook to provide a "view in browser" menu link. */

    body { width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; margin: 0; padding: 0; } 
    /* Prevent Webkit and Windows Mobile platforms from changing default font sizes.*/ 

    #backgroundTable { margin: 0; padding: 0; width: 100% !important; line-height: 100% !important; }
    /* end reset */

    img { display: block; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; font-size: 10px; } 
    a img { border: none; }
    /* Some sensible defaults for images*/

    .ghost-link img { display: inline-block; }
    /* Removes unwanted linked space - only links the image */

    /***************************************
                 SAFETY STYLES 
    ****************************************/

    .safety td {
      color: #263340;
    }

    .safety .ul .ul {
      padding-bottom: 0;
    }

  </style>

  <style type="text/css" data-embed>
    /***************************************
                GLOBAL STYLES
    ****************************************/

    body,
    td {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #263340;
      line-height: 20px;
    }
    /* Render font family properly in Outlook */

    table { font-size: inherit; }
    /* Prevent user agent from overriding font size e.g. Thunderbird, Lotus Notes 8.5, AOL*/

    * { line-height: inherit; }
    /* Prevent Outlook.com from overriding line-height */

    table td { border-collapse: collapse; /*mso-line-height-rule: exactly;*/ }
    /* Outlook 07, 10 Padding issue fix
    Bring inline: No.*/

    a[x-apple-data-detectors] {
      color: inherit !important;
      text-decoration: none !important;
      font-size: inherit !important;
      font-family: inherit !important;
      font-weight: inherit !important;
      line-height: inherit !important;
    }
    /* Disguises iOS auto links */

    .mobile-only { 
      display: none; 
      max-height: 0px; 
      overflow: hidden; 
      mso-hide: all;
    }
    /*Hides mobile only elements. Make sure this is the first class and place it on both the parent <tr> and <td>*/

    .mobile-only table { 
      mso-hide: all; 
    }
    /* Hides <table> elements in Outlook 2007-13 issue */

    .address a { color: #ffffff !important; text-decoration: none !important; }
    /* Hack to fix auto-linking on dark backgrounds. Replace with your own text color.  */

    /***************************************
                Hover State Button
    ****************************************/

    /* uncomment below for hover state button */

        /* .button:hover {

          transition: background 200ms;
        }

          background: #7fbf12 !important;
          transition: background 200ms;
          color: #ffffff !important;
          transition: color 200ms;
        } */

   /* ***** Add the code below to your outlook conditionals when hover state is in use ***** */
   
        /* .button { border: 1px solid #00ccff !important; }
        .button a { 
          border: 1px solid #00ccff !important; 
          padding-top: 10px !important;
          padding-bottom: 10px !important; 
        } */


    /***************************************
               MOBILE STYLES
    ****************************************/
    
    @media only screen and (max-width: 37.5em) {

      .main-table { width: 100% !important; }
      .main-td { min-width: initial !important; }
      .main-table table { width: 100% !important; margin: 0 auto !important; }
      
      .block, 
      .left-content, 
      .safety { display: block; }
      /* place content you want stacked here */

      .desktop-only { display: none !important; }
      /* hide elements for mobile */

      img { max-width: 100% !important; height: auto !important; }
      /* large images resize down according to their parent container size */

      .w100 { width: 100% !important; }
      /*fixes issue where Outlook ignores max-width on images, also use for images-off screenshots */

      .mobile-only { display: block !important; max-height: none !important; overflow: visible !important; }

      .width-auto { width: auto !important; height: auto !important; }
      /*add to mobile-only images and make sure width and height values are set to zero*/

      .max-none { max-width: none !important; }
      /*add to image class to expand to full width*/

      .m-center { text-align: center !important; margin: 0 auto !important; }

      /*.main-table .fixed-width300 { width: 300px !important; margin: 0 auto !important; }*/

      /*.m-pt0  { padding-top: 0 !important; }*/
      /*.m-pt5  { padding-top: 5px !important; }*/
      /*.m-pt10 { padding-top: 10px !important; }*/ 
      /*.m-pt15 { padding-top: 15px !important; }*/
      /*.m-pt20 { padding-top: 20px !important; }*/
      /*.m-pt25 { padding-top: 25px !important; }*/
      /*.m-pt30 { padding-top: 30px !important; }*/
      /*.m-pt35 { padding-top: 35px !important; }*/
      /*.m-pt40 { padding-top: 40px !important; }*/
      /* mobile padding top */
      
      /*.m-pb0  { padding-bottom: 0 !important; } */
      /*.m-pb5  { padding-bottom: 5px !important; }*/
      /*.m-pb10 { padding-bottom: 10px !important; }*/
      /*.m-pb15 { padding-bottom: 15px !important; }*/
      /*.m-pb20 { padding-bottom: 20px !important; }*/
      /*.m-pb25 { padding-bottom: 25px !important; }*/
      /*.m-pb30 { padding-bottom: 30px !important; }*/
      /*.m-pb35 { padding-bottom: 35px !important; }*/
      /*.m-pb40 { padding-bottom: 40px !important; }*/
      /* mobile padding bottom */
   
    }
  </style>
  

</head>
<body>
  
  <table align="center" role="presentation" border="0" cellpadding="0" cellspacing="0" id="backgroundTable" width="100%">

    <tr>
      <td class="main-td">
        <table class="main-table" align="center" role="presentation" border="0" cellpadding="0" cellspacing="0" width="{{build.breakpoints.large.value}}" style="width:{{build.breakpoints.large.value}}{{build.breakpoints.large.unit}};">

      <!-- Start Preheader -->
          <tr>
            <td class="preheader">
              <table align="center" role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td><span id="preheader">{{build.preheader}}</span></td>
                  <td class="webversion pl20" align="right">
                    <a href="{{token.permalink}}">View in browser</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
      <!-- End Preheader -->

      <!-- Start Header -->
          <tr>
            <td class="header">
              <table align="center" role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">

                <tr><td>ADD HEADER CONTENT </td></tr>
                <!-- DELETE THIS TABLE ROW AND ADD YOUR OWN!!! -->

              </table>
            </td>
          </tr>
      <!-- End Header -->

      <!-- Start 2 column content -->
          <tr>
            <td class="pb20">
              <table align="center" role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <!-- start left column -->
                  <td class="left-content" valign="top">
                    <!-- ***** ADD TABLE BLOCKS HERE ***** -->

                    Insert Table Block here (tint)

                    <!-- ***** END ADD TABLE BLOCKS HERE ***** -->
                    
                  </td>
                  <!-- end left column -->

                  <!-- start right column -->
                  <td class="safety" valign="top">
                    
                    <table align="center" role="presentation" border="0" cellpadding="0" cellspacing="0" width="200" style="width: 200px;">
                      <tr>
                        <td class="rr-safety">
                          <!-- ***** ADD TABLE BLOCKS HERE ***** -->

                          Insert Table Block here (tint)

                          <!-- ***** END ADD TABLE BLOCKS HERE ***** -->
                        </td>
                      </tr>

                    </table>
                  </td>
                  <!-- end right column -->
                </tr>
              </table> 
            </td>
          </tr>
      <!-- End 2 column Content -->

      <!-- Start ISI Continued-->
          <tr>
            <td class="safety safety-cont">
              <table align="center" role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                <!-- Paste safety content here -->

                {{token.gne-co-disclaimer}}
              </table>
             </td>
          </tr>
      <!-- End ISI Continued -->

        </table>
      </td>
    </tr>

  </table>
  <!-- end table wrapper -->

  <div style="display:none; white-space:nowrap; font:15px courier; line-height:0;">
