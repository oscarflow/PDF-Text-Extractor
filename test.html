{% form 'product', product %}
  <!-- Variants -->
  {% unless product.has_only_default_variant %}
    <div class="product-variants">
      <label for="variant-select">Select Option</label>
      <select name="id" id="variant-select">
        {% for variant in product.variants %}
          <option 
            value="{{ variant.id }}"
            {% unless variant.available %}disabled{% endunless %}>
            {{ variant.title }} - {{ variant.price | money }}
            {% unless variant.available %} (Sold Out){% endunless %}
          </option>
        {% endfor %}
      </select>
    </div>
  {% else %}
    <!-- IMPORTANT: This hidden input is required for products with no variants -->
    <input type="hidden" name="id" value="{{ product.selected_or_first_available_variant.id }}">
  {% endunless %}

  <!-- Quantity -->
  <div class="product-quantity">
    <label for="quantity">Quantity</label>
    <input type="number" name="quantity" id="quantity" value="1" min="1">
  </div>

  <!-- Add to Cart Button -->
  <button type="submit" name="add" class="btn-add-to-cart">
    {% if product.available %}
      Add to Cart
    {% else %}
      Sold Out
    {% endif %}
  </button>
{% endform %}
